name: tests

# Runs the unit tests on every push and pull request, on a clean Linux machine.
# No dataset or model download is needed: the tests use synthetic audio and tiny models.
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (video input test)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install dependencies (CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==$(grep '^torch==' requirements.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v
