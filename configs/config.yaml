# TenVoices: shared settings.
# Every path is relative to the repository root. Change settings here, not in code;
# a single run can override them with CLI options.

seed: 42

paths:
  phrases: data/prompts/phrases.csv
  metadata: data/metadata
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results
  images: images
  outputs: outputs

# Runs kept together in one member's folder: results/<folder>/<run>/<dataset>/, with the
# noise tests in results/<folder>/noise/ and the figures in results/<folder>/figures/.
# Runs not listed here use results/<run>/<dataset>/ and images/confusion/.
result_folders:
  M1_tanvir: [random_forest, whisper_small, w2v2_15ep_noise, w2v2_15ep]

# The two TenVoices subsets (docs/DATASETS.md). Runs choose one with --dataset fsc|l2arctic.
datasets:
  fsc:
    name: TenVoices-FSC
    source: Fluent Speech Commands
    raw: data/raw/fsc                          # extracted original archive (gitignored)
    phrases: data/prompts/fsc_phrases.csv      # written by support/select_subsets.py (T42)
    subset: data/subsets/fsc.csv
    speakers_per_gender: 5
    n_phrases: 50
    takes: 2
  l2arctic:
    name: TenVoices-L2
    source: L2-ARCTIC v5.0
    raw: data/raw/l2arctic
    phrases: data/prompts/l2arctic_sentences.csv
    subset: data/subsets/l2arctic.csv
    speakers: [TNI, ASI, LXC, BWC, NJS, EBVS, HJK, YKWK, PNV, HQTV]   # (F, M) of Hindi, Mandarin, Spanish, Korean, Vietnamese
    n_phrases: 50
    takes: 1
    fold_by_l1: true      # each fold tests one first language (1 F + 1 M) never heard in training; folds follow the order above

# Random split and speaker-independent folds (support/make_splits.py, T08)
splits:
  test_size: 0.2          # random split: share of clips for testing (stratified by phrase)
  val_size: 0.1           # share of the training part held out for validation
  n_folds: 5              # each fold: 2 test speakers (1 F + 1 M), 1 validation, 7 training

audio:
  sample_rate: 16000      # Hz, input rate of wav2vec 2.0 and the MFCC features
  mono: true
  trim_top_db: 30         # frames this many dB below the clip's peak count as silence
  trim_margin_s: 0.10     # silence kept before and after the speech, so soft onsets are not cut
  peak_dbfs: -1.0         # peak level after normalisation
  max_duration_s: 6.0     # clips are padded to this length and never truncated

# MFCC summary features for the traditional models (support/features.py, T11)
features:
  n_mfcc: 13              # + delta + delta-delta, each summarised by mean and std -> 78 values
  n_fft: 512              # 32 ms window at 16 kHz
  hop_length: 160         # 10 ms hop
  n_mels: 40

# Traditional models (support/classical.py, T11-T14): every combination is tried on the
# validation part; the best one is scored once on the test part.
classical:
  random_forest:
    n_estimators: [300]
    max_depth: [null, 20]
    min_samples_leaf: [1, 2]
  xgboost:
    n_estimators: [300]
    max_depth: [4, 6]
    learning_rate: [0.1, 0.3]
  knn:
    n_neighbors: [1, 3, 5, 7]
    weights: [uniform, distance]
  svm:
    C: [1, 10, 100]
    gamma: [scale, 0.01]
  logreg:                 # linear probe on frozen embeddings (T46)
    C: [0.01, 0.1, 1, 10]

# wav2vec 2.0 fine-tuning (support/train_wav2vec2.py, T15-T19). Runs choose --epochs and --noise.
wav2vec2:
  model: facebook/wav2vec2-base
  learning_rate: 3.0e-5
  batch_size: 4
  grad_accum: 2           # effective batch size 8
  warmup_ratio: 0.1
  weight_decay: 0.0
  freeze_feature_encoder: true   # keep the CNN feature encoder fixed, as usual for wav2vec 2.0 fine-tuning

# White-noise augmentation of training clips (--noise white); never applied to validation or test
augmentation:
  p: 0.5                  # share of training clips that get noise
  snr_db: [5, 30]         # "random amplitude": SNR drawn uniformly from this range

# Noise tests on the test clips (T21)
noise_test:
  snr_db: [20, 10, 5]

whisper:
  model: openai/whisper-small
  language: en
  batch_size: 8
  top_k: 5
  reject_wer: 0.5         # demo only: best phrase further than this -> "not one of the 50 phrases"
